<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5D Muscle Log 2.0</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{
      --bg:#07101f;--panel:#111827;--panel2:#172033;--line:#2b3a52;
      --text:#f8fafc;--muted:#94a3b8;--accent:#60a5fa;--green:#34d399;
      --red:#fb7185;--yellow:#fbbf24;--purple:#c084fc;
      --shadow:0 12px 32px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:linear-gradient(180deg,#050914,#07101f 40%,#081221);
      color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      min-height:100vh
    }
    .app{max-width:1050px;margin:auto;padding:16px 12px 120px}
    h1,h2,h3{margin-top:0}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
    h1{font-size:28px;margin-bottom:3px}
    .subtitle,.muted{color:var(--muted)}
    .badge{border:1px solid var(--line);background:#0f1b31;padding:8px 12px;border-radius:999px;font-size:13px}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
    button,.btn{
      border:none;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;
      background:#22304a;color:var(--text)
    }
    button:hover{filter:brightness(1.08)}
    .tab{white-space:nowrap;background:#121b2c;border:1px solid var(--line);color:#cbd5e1}
    .tab.active{background:var(--accent);color:#07111f;border-color:transparent}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .primary{background:var(--accent);color:#07111f}
    .success{background:var(--green);color:#052016}
    .ghost{background:#121b2c;border:1px solid var(--line)}
    .danger{background:#351722;color:#fecdd3;border:1px solid #63283b}
    .warn{background:#3a2a08;color:#fde68a;border:1px solid #6d4b0f}
    .card,.exercise{
      background:rgba(17,24,39,.97);border:1px solid var(--line);border-radius:18px;
      box-shadow:var(--shadow)
    }
    .card{padding:14px;margin-bottom:12px}
    .exercise{padding:14px;margin-bottom:12px}
    .section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .section-title h2{font-size:22px;margin-bottom:3px}
    .day-note{font-size:13px;color:var(--muted)}
    .exercise-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
    .exercise-name{font-size:18px;font-weight:900}
    .target{font-size:13px;color:var(--accent);margin-top:3px}
    .suggestion{
      margin:8px 0 10px;padding:9px 10px;border-radius:12px;
      background:#0d1b2e;border:1px solid #28466d;color:#dbeafe;font-size:13px
    }
    .pr{color:#fde68a;font-weight:800}
    .exercise-actions{display:flex;gap:6px}
    .iconbtn{padding:7px 9px;background:#1a263a;border:1px solid var(--line)}
    .iconbtn.red{background:#341822;color:#fecdd3}
    .set-head,.set-row{
      display:grid;grid-template-columns:44px 1fr 1fr .75fr 46px;gap:7px;align-items:center
    }
    .set-head{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
    .set-row{margin-bottom:7px}
    .set-num{
      width:38px;height:38px;border-radius:10px;background:#0d1625;display:grid;place-items:center;
      color:#cbd5e1;font-weight:900
    }
    input,select,textarea{
      width:100%;background:#0b1322;border:1px solid #31405b;color:var(--text);
      border-radius:10px;padding:9px;font-size:16px;outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(96,165,250,.12)}
    .donebox{
      appearance:none;width:38px;height:38px;margin:0;border-radius:10px;border:1px solid #40506e;
      background:#0b1322;cursor:pointer
    }
    .donebox:checked{background:var(--green);border-color:var(--green)}
    .donebox:checked:after{content:"✓";display:grid;place-items:center;height:100%;font-size:21px;font-weight:900;color:#052016}
    .exercise-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
    .mini{padding:7px 9px;border-radius:10px;font-size:12px;background:#172238;border:1px solid var(--line)}
    .last{font-size:12px;color:var(--muted)}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .stat{padding:12px;background:#0d1625;border:1px solid var(--line);border-radius:14px}
    .stat .n{font-size:23px;font-weight:900}
    .stat .l{font-size:12px;color:var(--muted)}
    .muscle-row{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;margin:8px 0}
    .bar{height:10px;background:#0c1422;border-radius:999px;overflow:hidden}
    .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:999px}
    canvas{width:100%;height:220px;background:#0a1322;border-radius:12px;border:1px solid var(--line)}
    .timer{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap
    }
    .timer-display{font-size:34px;font-weight:900;min-width:110px}
    .bottom{
      position:fixed;left:0;right:0;bottom:0;background:rgba(5,9,20,.92);backdrop-filter:blur(14px);
      border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20
    }
    .bottom-inner{max-width:1050px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;
      padding:16px;z-index:50
    }
    .modal.show{display:flex}
    .modal-box{width:min(540px,100%);background:#111827;border:1px solid var(--line);border-radius:18px;padding:16px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px}
    .history-item{border-top:1px solid var(--line);padding:12px 0}
    .history-item:first-child{border-top:none}
    .history-date{font-weight:900}
    .history-summary{font-size:13px;color:#cbd5e1;margin-top:5px}
    .empty{text-align:center;color:var(--muted);padding:20px}
    @media(max-width:720px){
      .stats-grid{grid-template-columns:repeat(2,1fr)}
      .set-head,.set-row{grid-template-columns:40px 1fr 1fr .72fr 42px;gap:5px}
      .exercise{padding:11px 8px}
      .badge{display:none}
      h1{font-size:24px}
      .muscle-row{grid-template-columns:92px 1fr 42px}
    }
  </style>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>5D Muscle Log 2.0</h1>
      <div class="subtitle">Hipertrofijos planas • progresija • rekordai • grafikai</div>
    </div>
    <div class="badge">Saugoma šiame įrenginyje</div>
  </div>

  <div id="tabs" class="tabs"></div>

  <div class="section-title">
    <div>
      <h2 id="dayTitle"></h2>
      <div id="dayNote" class="day-note"></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="primary" onclick="openExerciseModal()">+ Pridėti pratimą</button>
    <button class="ghost" onclick="showPanel('stats')">Statistika</button>
    <button class="ghost" onclick="showPanel('history')">Istorija</button>
    <button class="ghost" onclick="showPanel('timer')">Timeris</button>
    <button class="ghost" onclick="exportData()">Eksportuoti</button>
    <label class="btn ghost">Importuoti
      <input type="file" accept=".json" style="display:none" onchange="importData(event)">
    </label>
  </div>

  <div id="statsPanel" class="card" style="display:none">
    <h3>Šios savaitės suvestinė</h3>
    <div id="statsGrid" class="stats-grid"></div>
    <h3 style="margin-top:16px">Setai pagal raumenų grupę</h3>
    <div id="muscleStats"></div>
    <h3 style="margin-top:16px">Treniruočių apimtis per laiką</h3>
    <canvas id="volumeChart" width="900" height="220"></canvas>
  </div>

  <div id="timerPanel" class="card" style="display:none">
    <h3>Poilsio timeris</h3>
    <div class="timer">
      <div id="timerDisplay" class="timer-display">02:00</div>
      <button class="primary" onclick="startTimer(120)">2:00</button>
      <button class="primary" onclick="startTimer(180)">3:00</button>
      <button class="primary" onclick="startTimer(240)">4:00</button>
      <button class="ghost" onclick="pauseResumeTimer()">⏯</button>
      <button class="danger" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <div id="historyPanel" class="card" style="display:none">
    <h3>Treniruočių istorija</h3>
    <div id="historyList"></div>
  </div>

  <div id="exerciseList"></div>
</div>

<div class="bottom">
  <div class="bottom-inner">
    <button class="ghost" onclick="clearCurrentInputs()">Išvalyti šiandien</button>
    <button class="success" onclick="finishWorkout()">✓ Užbaigti treniruotę</button>
  </div>
</div>

<div id="exerciseModal" class="modal" onclick="modalOutside(event)">
  <div class="modal-box">
    <h3 id="modalTitle">Pridėti pratimą</h3>
    <div class="field">
      <label>Pratimo pavadinimas</label>
      <input id="exerciseNameInput" placeholder="Pvz. Incline Smith Press">
    </div>
    <div class="field">
      <label>Raumenų grupė</label>
      <select id="exerciseMuscleInput">
        <option>Krūtinė</option><option>Nugara</option><option>Quads</option><option>Hamstrings</option>
        <option>Sėdmenys</option><option>Šoninės deltos</option><option>Galinės deltos</option>
        <option>Bicepsas</option><option>Tricepsas</option><option>Blauzdos</option><option>Pilvas</option><option>Kita</option>
      </select>
    </div>
    <div class="field">
      <label>Tikslas / rep range</label>
      <input id="exerciseTargetInput" placeholder="Pvz. 3 × 6–10">
    </div>
    <div class="field">
      <label>Pradinis setų skaičius</label>
      <input id="exerciseSetsInput" type="number" min="1" max="12" value="3">
    </div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeExerciseModal()">Atšaukti</button>
      <button class="primary" onclick="saveExercise()">Išsaugoti</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY='muscleLog5d_v2';

const defaultPlan=[
{name:'Upper A',note:'Krūtinė • nugara • pečiai • rankos',exercises:[
['Incline Smith Machine Press','Krūtinė','3 × 6–10',3],
['Neutral Grip Lat Pulldown','Nugara','3 × 8–12',3],
['Chest Supported Row','Nugara','3 × 8–12',3],
['Machine Chest Press','Krūtinė','2 × 10–15',2],
['Cable Lateral Raise','Šoninės deltos','3 × 12–20',3],
['Incline Dumbbell Curl','Bicepsas','2 × 10–15',2],
['Overhead Cable Triceps Extension','Tricepsas','2 × 10–15',2]]},
{name:'Lower A',note:'Quads • hamstrings • blauzdos • pilvas',exercises:[
['Hack Squat','Quads','3 × 6–10',3],
['Romanian Deadlift','Hamstrings','3 × 6–10',3],
['Seated Leg Curl','Hamstrings','3 × 10–15',3],
['Leg Extension','Quads','2 × 10–15',2],
['Standing Calf Raise','Blauzdos','4 × 8–15',4],
['Cable Crunch','Pilvas','3 × 10–20',3]]},
{name:'Push',note:'Krūtinė • pečiai • tricepsas',exercises:[
['Flat Machine Chest Press','Krūtinė','3 × 6–10',3],
['Incline Dumbbell Press','Krūtinė','2 × 8–12',2],
['Machine / Smith Shoulder Press','Šoninės deltos','2 × 8–12',2],
['Cable Lateral Raise','Šoninės deltos','4 × 12–20',4],
['Cable Triceps Pushdown','Tricepsas','3 × 10–15',3],
['Overhead Cable Triceps Extension','Tricepsas','2 × 10–15',2]]},
{name:'Pull',note:'Nugara • rear delts • bicepsas',exercises:[
['Pull-up / Lat Pulldown','Nugara','3 × 6–10',3],
['One Arm Cable Row','Nugara','3 × 8–15',3],
['Straight Arm Cable Pulldown / Lat Prayer','Nugara','2 × 12–20',2],
['Reverse Pec Deck','Galinės deltos','3 × 12–20',3],
['Machine Preacher Curl','Bicepsas','3 × 8–12',3],
['Cable Bayesian Curl','Bicepsas','2 × 12–20',2]]},
{name:'Lower B + delts',note:'Kojos • sėdmenys • blauzdos • šoninės deltos',exercises:[
['Leg Press','Quads','3 × 10–15',3],
['Bulgarian Split Squat','Quads','2 × 8–15 / kojai',2],
['Lying Leg Curl','Hamstrings','3 × 10–15',3],
['Hip Thrust','Sėdmenys','2 × 8–15',2],
['Seated Calf Raise','Blauzdos','4 × 10–20',4],
['Machine Lateral Raise','Šoninės deltos','3 × 15–25',3],
['Hanging Leg Raise','Pilvas','3 × 8–15',3]]}
];

function rid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function createState(){return{
 currentDay:0,
 plan:defaultPlan.map(d=>({name:d.name,note:d.note,exercises:d.exercises.map(([name,muscle,target,sets])=>({
   id:rid(),name,muscle,target,sets:Array.from({length:sets},()=>({weight:'',reps:'',rir:'',done:false}))
 }))})),
 history:[]
}}

let state=loadState(),editingExerciseId=null;
function loadState(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw)return JSON.parse(raw);
  const v1=localStorage.getItem('muscleLog5d_v1');
  if(v1){
    const old=JSON.parse(v1);
    if(old.plan){
      old.plan.forEach(d=>d.exercises.forEach(e=>{if(!e.muscle)e.muscle='Kita'}));
      return old;
    }
  }
 }catch(e){}
 return createState();
}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function render(){
 const tabs=document.getElementById('tabs');
 tabs.innerHTML=state.plan.map((d,i)=>`<button class="tab ${i===state.currentDay?'active':''}" onclick="selectDay(${i})">${i+1}. ${esc(d.name)}</button>`).join('');
 const day=state.plan[state.currentDay];
 day.exercises.forEach(e=>{if(!e.muscle)e.muscle='Kita'});
 document.getElementById('dayTitle').textContent=day.name;
 document.getElementById('dayNote').textContent=day.note||'';
 document.getElementById('exerciseList').innerHTML=day.exercises.length?day.exercises.map(exerciseHtml).join(''):'<div class="empty">Nėra pratimų.</div>';
 renderHistory();renderStats();
}

function exerciseHtml(ex){
 const last=getLastExercise(ex.name), sug=getSuggestion(ex.name,ex.target), pr=getPR(ex.name);
 return `<div class="exercise">
  <div class="exercise-head">
   <div>
    <div class="exercise-name">${esc(ex.name)}</div>
    <div class="target">${esc(ex.muscle)} • ${esc(ex.target||'')}</div>
   </div>
   <div class="exercise-actions">
    <button class="iconbtn" onclick="openExerciseModal('${ex.id}')">✎</button>
    <button class="iconbtn red" onclick="deleteExercise('${ex.id}')">×</button>
   </div>
  </div>
  ${sug?`<div class="suggestion"><b>Kitas tikslas:</b> ${esc(sug)} ${pr?`<span class="pr">• PR: ${esc(pr)}</span>`:''}</div>`:(pr?`<div class="suggestion"><span class="pr">PR: ${esc(pr)}</span></div>`:'')}
  <div class="set-head"><div>Setas</div><div>kg</div><div>Reps</div><div>RIR</div><div>Done</div></div>
  ${ex.sets.map((s,i)=>`<div class="set-row">
    <div class="set-num">${i+1}</div>
    <input inputmode="decimal" value="${esc(s.weight)}" placeholder="0" onchange="updateSet('${ex.id}',${i},'weight',this.value)">
    <input inputmode="numeric" value="${esc(s.reps)}" placeholder="0" onchange="updateSet('${ex.id}',${i},'reps',this.value)">
    <input inputmode="numeric" value="${esc(s.rir)}" placeholder="2" onchange="updateSet('${ex.id}',${i},'rir',this.value)">
    <input class="donebox" type="checkbox" ${s.done?'checked':''} onchange="updateSet('${ex.id}',${i},'done',this.checked)">
  </div>`).join('')}
  <div class="exercise-foot">
   <div><button class="mini" onclick="addSet('${ex.id}')">+ Setas</button> ${ex.sets.length>1?`<button class="mini" onclick="removeSet('${ex.id}')">− Setas</button>`:''}</div>
   <div class="last">${last?'Praeita: '+esc(last):'Praeitos treniruotės nėra'}</div>
  </div>
 </div>`;
}

function selectDay(i){state.currentDay=i;saveState();render()}
function findExercise(id){return state.plan[state.currentDay].exercises.find(e=>e.id===id)}
function updateSet(id,i,k,v){const e=findExercise(id);if(e&&e.sets[i]){e.sets[i][k]=v;saveState()}}
function addSet(id){findExercise(id).sets.push({weight:'',reps:'',rir:'',done:false});saveState();render()}
function removeSet(id){const e=findExercise(id);if(e.sets.length>1)e.sets.pop();saveState();render()}
function deleteExercise(id){
 const e=findExercise(id);if(!e)return;
 if(confirm(`Ištrinti „${e.name}“?`)){state.plan[state.currentDay].exercises=state.plan[state.currentDay].exercises.filter(x=>x.id!==id);saveState();render()}
}

function openExerciseModal(id=null){
 editingExerciseId=id;
 const m=document.getElementById('exerciseModal'),n=document.getElementById('exerciseNameInput'),
 t=document.getElementById('exerciseTargetInput'),s=document.getElementById('exerciseSetsInput'),
 mu=document.getElementById('exerciseMuscleInput');
 if(id){
  const e=findExercise(id);document.getElementById('modalTitle').textContent='Redaguoti pratimą';
  n.value=e.name;t.value=e.target||'';s.value=e.sets.length;mu.value=e.muscle||'Kita';
 }else{
  document.getElementById('modalTitle').textContent='Pridėti pratimą';n.value='';t.value='';s.value=3;mu.value='Kita';
 }
 m.classList.add('show');setTimeout(()=>n.focus(),50)
}
function closeExerciseModal(){document.getElementById('exerciseModal').classList.remove('show')}
function modalOutside(e){if(e.target.id==='exerciseModal')closeExerciseModal()}
function saveExercise(){
 const name=document.getElementById('exerciseNameInput').value.trim();
 const target=document.getElementById('exerciseTargetInput').value.trim();
 const muscle=document.getElementById('exerciseMuscleInput').value;
 let count=parseInt(document.getElementById('exerciseSetsInput').value)||3;
 count=Math.max(1,Math.min(12,count));
 if(!name){alert('Įrašyk pratimo pavadinimą.');return}
 if(editingExerciseId){
  const e=findExercise(editingExerciseId);e.name=name;e.target=target;e.muscle=muscle;
  while(e.sets.length<count)e.sets.push({weight:'',reps:'',rir:'',done:false});
  while(e.sets.length>count)e.sets.pop();
 }else state.plan[state.currentDay].exercises.push({id:rid(),name,muscle,target,sets:Array.from({length:count},()=>({weight:'',reps:'',rir:'',done:false}))});
 saveState();closeExerciseModal();render()
}

function finishWorkout(){
 const day=state.plan[state.currentDay];
 const perf=day.exercises.map(ex=>({
  name:ex.name,muscle:ex.muscle,target:ex.target,
  sets:ex.sets.filter(s=>s.weight!==''||s.reps!==''||s.rir!==''||s.done).map(s=>({...s}))
 })).filter(e=>e.sets.length);
 if(!perf.length){alert('Pirmiausia įrašyk bent vieną setą.');return}
 state.history.unshift({id:rid(),date:new Date().toISOString(),dayName:day.name,exercises:perf});
 day.exercises.forEach(e=>e.sets.forEach(s=>{s.weight='';s.reps='';s.rir='';s.done=false}));
 saveState();render();showPanel('history');window.scrollTo({top:0,behavior:'smooth'})
}
function clearCurrentInputs(){
 if(!confirm('Išvalyti visus šios dienos įrašus?'))return;
 state.plan[state.currentDay].exercises.forEach(e=>e.sets.forEach(s=>{s.weight='';s.reps='';s.rir='';s.done=false}));
 saveState();render()
}

function getLastExercise(name){
 for(const w of state.history){
  const e=w.exercises.find(x=>x.name===name);
  if(e&&e.sets.length){
   const s=e.sets[0],b=[];if(s.weight!=='')b.push(`${s.weight} kg`);if(s.reps!=='')b.push(`× ${s.reps}`);if(s.rir!=='')b.push(`@ ${s.rir} RIR`);
   return b.join(' ')
  }
 }return ''
}

function parseRepRange(target){
 const m=String(target||'').match(/(\d+)\s*[–-]\s*(\d+)/);
 return m?{min:+m[1],max:+m[2]}:null
}
function getSuggestion(name,target){
 const range=parseRepRange(target);
 let last=null;
 for(const w of state.history){const e=w.exercises.find(x=>x.name===name);if(e&&e.sets.length){last=e;break}}
 if(!last)return range?`Pradėk maždaug ${range.min}–${range.max} reps, ~2–3 RIR`:'Įrašyk pirmą treniruotę';
 const valid=last.sets.map(s=>({w:+s.weight,r:+s.reps,rir:+s.rir})).filter(s=>Number.isFinite(s.w)&&s.w>0&&Number.isFinite(s.r)&&s.r>0);
 if(!valid.length)return '';
 const top=Math.max(...valid.map(s=>s.r));
 const avgW=valid.reduce((a,s)=>a+s.w,0)/valid.length;
 const minRir=Math.min(...valid.map(s=>Number.isFinite(s.rir)?s.rir:9));
 if(range&&top>=range.max&&minRir<=2){
   const inc=avgW<20?1:avgW<60?2.5:5;
   return `didink svorį maždaug iki ${(avgW+inc).toFixed(avgW<20?1:0)} kg ir lik tame pačiame rep range`;
 }
 if(range&&top<range.max)return `palik panašų svorį ir bandyk pridėti 1 rep bent keliuose setuose`;
 return `kartok arba pridėk mažą progresą, jei technika gera ir RIR ≤2–3`;
}
function getPR(name){
 let bestW=0,bestSet=null;
 for(const w of state.history)for(const e of w.exercises)if(e.name===name)for(const s of e.sets){
  const ww=+s.weight,rr=+s.reps;
  if(Number.isFinite(ww)&&ww>bestW){bestW=ww;bestSet={ww,rr}}
 }
 return bestSet?`${bestSet.ww} kg × ${bestSet.rr||'?'} reps`:''
}

function showPanel(which){
 ['stats','history','timer'].forEach(p=>document.getElementById(p+'Panel').style.display=p===which?'block':'none');
 if(which==='stats'){renderStats();setTimeout(drawChart,50)}
 if(which==='history')renderHistory()
}

function weekStart(d=new Date()){
 const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x
}
function volumeOfWorkout(w){
 let v=0;for(const e of w.exercises)for(const s of e.sets){const kg=+s.weight,r=+s.reps;if(kg>0&&r>0)v+=kg*r}return v
}
function renderStats(){
 const ws=weekStart(),week=state.history.filter(w=>new Date(w.date)>=ws);
 let sets=0,vol=0;const muscles={};
 for(const w of week)for(const e of w.exercises){
  const m=e.muscle||'Kita';muscles[m]=(muscles[m]||0)+e.sets.length;sets+=e.sets.length;
  for(const s of e.sets){const kg=+s.weight,r=+s.reps;if(kg>0&&r>0)vol+=kg*r}
 }
 const prs=new Set();
 for(const d of state.plan)for(const e of d.exercises)if(getPR(e.name))prs.add(e.name);
 document.getElementById('statsGrid').innerHTML=[
  ['Treniruotės',week.length],['Setai',sets],['Apimtis',Math.round(vol).toLocaleString('lt-LT')+' kg'],['Pratimų PR',prs.size]
 ].map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
 const max=Math.max(1,...Object.values(muscles));
 document.getElementById('muscleStats').innerHTML=Object.keys(muscles).length?
  Object.entries(muscles).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<div class="muscle-row"><div>${esc(m)}</div><div class="bar"><span style="width:${(n/max)*100}%"></span></div><div>${n}</div></div>`).join('')
  :'<div class="muted">Šią savaitę dar nėra užbaigtų treniruočių.</div>';
}
function drawChart(){
 const c=document.getElementById('volumeChart');if(!c)return;const ctx=c.getContext('2d');
 const rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=rect.width*dpr;c.height=220*dpr;ctx.scale(dpr,dpr);
 const W=rect.width,H=220;ctx.clearRect(0,0,W,H);
 const data=[...state.history].reverse().slice(-12).map(w=>({label:new Date(w.date).toLocaleDateString('lt-LT',{month:'2-digit',day:'2-digit'}),v:volumeOfWorkout(w)}));
 if(!data.length){ctx.fillStyle='#94a3b8';ctx.font='14px sans-serif';ctx.fillText('Dar nėra duomenų grafikui.',18,30);return}
 const pad={l:44,r:12,t:16,b:34},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,max=Math.max(...data.map(x=>x.v),1);
 ctx.strokeStyle='#2b3a52';ctx.lineWidth=1;
 for(let i=0;i<4;i++){const y=pad.t+ch*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke()}
 ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;ctx.beginPath();
 data.forEach((x,i)=>{const px=pad.l+(data.length===1?cw/2:cw*i/(data.length-1)),py=pad.t+ch-(x.v/max)*ch;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});
 ctx.stroke();
 ctx.fillStyle='#60a5fa';data.forEach((x,i)=>{const px=pad.l+(data.length===1?cw/2:cw*i/(data.length-1)),py=pad.t+ch-(x.v/max)*ch;ctx.beginPath();ctx.arc(px,py,3.5,0,Math.PI*2);ctx.fill()});
 ctx.fillStyle='#94a3b8';ctx.font='11px sans-serif';ctx.textAlign='center';
 data.forEach((x,i)=>{if(data.length<=8||i%2===0){const px=pad.l+(data.length===1?cw/2:cw*i/(data.length-1));ctx.fillText(x.label,px,H-12)}});
 ctx.textAlign='right';ctx.fillText(Math.round(max).toLocaleString('lt-LT'),pad.l-6,pad.t+4);ctx.fillText('0',pad.l-6,pad.t+ch+4)
}

function renderHistory(){
 const box=document.getElementById('historyList');
 if(!state.history.length){box.innerHTML='<div class="empty">Dar nėra treniruočių.</div>';return}
 box.innerHTML=state.history.slice(0,50).map(w=>`<div class="history-item">
  <div class="history-date">${esc(w.dayName)} — ${new Date(w.date).toLocaleString('lt-LT',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
  <div class="history-summary">${w.exercises.map(e=>`<div><b>${esc(e.name)}</b>: ${e.sets.map(s=>`${esc(s.weight||'?')}kg × ${esc(s.reps||'?')}${s.rir!==''?` @${esc(s.rir)}RIR`:''}`).join(', ')}</div>`).join('')}</div>
  <div style="margin-top:8px"><button class="mini danger" onclick="deleteHistory('${w.id}')">Ištrinti</button></div>
 </div>`).join('')
}
function deleteHistory(id){if(confirm('Ištrinti šią treniruotę?')){state.history=state.history.filter(w=>w.id!==id);saveState();render()}}

let timerSeconds=120,timerHandle=null,timerRunning=false;
function updateTimerDisplay(){const m=Math.floor(timerSeconds/60),s=timerSeconds%60;document.getElementById('timerDisplay').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function startTimer(sec){timerSeconds=sec;timerRunning=true;clearInterval(timerHandle);updateTimerDisplay();timerHandle=setInterval(()=>{if(!timerRunning)return;timerSeconds--;updateTimerDisplay();if(timerSeconds<=0){clearInterval(timerHandle);timerRunning=false;try{navigator.vibrate&&navigator.vibrate([250,100,250])}catch(e){}alert('Poilsio laikas baigėsi!')}},1000)}
function pauseResumeTimer(){timerRunning=!timerRunning}
function resetTimer(){clearInterval(timerHandle);timerRunning=false;timerSeconds=120;updateTimerDisplay()}

function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='5D-Muscle-Log-2-backup.json';a.click();URL.revokeObjectURL(url)
}
function importData(ev){
 const f=ev.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.plan||!Array.isArray(x.plan))throw 0;if(confirm('Pakeisti dabartinius programėlės duomenis importuotais?')){state=x;if(!Array.isArray(state.history))state.history=[];if(typeof state.currentDay!=='number')state.currentDay=0;saveState();render()}}catch(e){alert('Netinkamas JSON failas.')}ev.target.value=''};
 r.readAsText(f)
}

window.addEventListener('resize',()=>{if(document.getElementById('statsPanel').style.display==='block')drawChart()});
render();updateTimerDisplay();
</script>
